name: Build Ubuntu ARM64 rootfs candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rootfs-candidate.yml'
      - 'app/src/main/cpp/uml_net.c'
      - 'scripts/build-ubuntu-rootfs.sh'
      - 'scripts/check-rootfs-image.sh'
      - 'scripts/guest/test-kernel-capabilities.sh'
      - 'scripts/guest/uml_pty_server.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rootfs-candidate.yml'
      - 'app/src/main/cpp/uml_net.c'
      - 'scripts/build-ubuntu-rootfs.sh'
      - 'scripts/check-rootfs-image.sh'
      - 'scripts/guest/test-kernel-capabilities.sh'
      - 'scripts/guest/uml_pty_server.py'
  workflow_dispatch:
    inputs:
      ubuntu_release:
        description: Ubuntu series (noble = 24.04 LTS)
        required: true
        default: noble
        type: choice
        options: [noble, jammy]
      disk_size_mib:
        description: Virtual disk size in MiB
        required: true
        default: '2048'
        type: string
      kernel_diagnostics:
        description: Include optional guest kernel diagnostic tools
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  rootfs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 runner
        run: test "$(dpkg --print-architecture)" = arm64
      - name: Build candidate image
        env:
          UBUNTU_RELEASE: ${{ inputs.ubuntu_release || 'noble' }}
          DISK_SIZE_MIB: ${{ inputs.disk_size_mib || '2048' }}
          KERNEL_DIAGNOSTICS: ${{ inputs.kernel_diagnostics && '1' || '0' }}
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.work
        run: sudo -E ./scripts/build-ubuntu-rootfs.sh
      - name: Structural checks
        env:
          DISK_SIZE_MIB: ${{ inputs.disk_size_mib || '2048' }}
        run: sudo ./scripts/check-rootfs-image.sh out/ubuntu-${{ inputs.ubuntu_release || 'noble' }}-arm64.ext4
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ inputs.ubuntu_release || 'noble' }}-arm64-ext4-candidate
          path: |
            out/ubuntu-${{ inputs.ubuntu_release || 'noble' }}-arm64.ext4
            out/ubuntu-${{ inputs.ubuntu_release || 'noble' }}-arm64.ext4.sha256
          if-no-files-found: error
          retention-days: 30
