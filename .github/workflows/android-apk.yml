name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify preinstalled UML toolchain
        run: |
          test -d "$ANDROID_HOME/ndk/29.0.14206865"
          test -x "$ANDROID_HOME/cmake/3.31.5/bin/cmake"
      - name: Download checksum-verified UML binaries
        run: UML_OUTPUT="$PWD/app/src/main/jniLibs" bash scripts/fetch-uml.sh
      - name: Run terminal and VM regression tests
        run: |
          gradle --no-daemon -p third_party/termlib :lib:testDebugUnitTest \
            --tests org.connectbot.terminal.KeyboardHandlerTest \
            --tests org.connectbot.terminal.ImeInputViewTest \
            --tests org.connectbot.terminal.ResizeReflowTest \
            --tests org.connectbot.terminal.TerminalLifetimeTest
          gradle --no-daemon :app:testDebugUnitTest
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-uml-debug-apk
          path: app/build/outputs/apk/debug/*.apk
